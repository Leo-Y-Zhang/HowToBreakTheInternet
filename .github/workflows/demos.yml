name: demos
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run every demo
        run: |
          cd demos
          for f in toy_rsa.py shor_by_hand.py quantum_shor_sim.py make_challenge_number.py; do
            echo "== $f"; timeout 120 python3 "$f" < /dev/null
          done
          test -s challenge_public.txt && test -s challenge_secret.txt
